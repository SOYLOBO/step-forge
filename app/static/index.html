<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>build123d dashboard</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #15171c;
    --panel-2: #1c1f26;
    --border: #262a33;
    --text: #e6e8ec;
    --muted: #8a91a0;
    --accent: #6ea8ff;
    --accent-2: #5fdfb1;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: minmax(380px, 38%) 1fr; height: 100vh; }
  .left { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
  .right { position: relative; min-width: 0; background: #0a0b0e; }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); text-transform: uppercase; }
  header .grow { flex: 1; }
  .filechip { font-size: 12px; color: var(--muted); }
  .editor-wrap { flex: 1; position: relative; min-height: 0; display: flex; flex-direction: column; }
  textarea#code {
    flex: 1; width: 100%; resize: none; border: 0; outline: none;
    background: var(--panel); color: var(--text);
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 14px 16px; tab-size: 4;
  }
  .drop-overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(110, 168, 255, 0.08); border: 2px dashed var(--accent);
    color: var(--accent); font-weight: 600; pointer-events: none;
  }
  .left.dragging .drop-overlay { display: flex; }
  .toolbar {
    display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border);
    background: var(--panel-2); align-items: center;
  }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
    transition: background 120ms, border-color 120ms;
  }
  button:hover { background: #20242d; border-color: #323743; }
  button.primary { background: var(--accent); color: #0a0b0e; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #8bbcff; }
  button.success { background: var(--accent-2); color: #0a0b0e; border-color: var(--accent-2); font-weight: 600; }
  button.success:hover { background: #7eecc4; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .toolbar .grow { flex: 1; }
  .status {
    font-size: 12px; color: var(--muted); padding: 8px 12px;
    border-top: 1px solid var(--border); min-height: 32px; white-space: pre-wrap;
    max-height: 200px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--accent-2); }
  #viewer { width: 100%; height: 100%; display: block; }
  .hint {
    position: absolute; bottom: 12px; left: 12px; color: var(--muted); font-size: 11px;
    background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 4px;
    pointer-events: none;
  }
  input[type="file"] { display: none; }
  label.filebtn {
    display: inline-block; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 6px; font-size: 13px;
  }
  label.filebtn:hover { background: #20242d; }
</style>
</head>
<body>
<div class="app">
  <div class="left" id="leftPane">
    <header>
      <h1>build123d</h1>
      <span class="grow"></span>
      <span class="filechip" id="filechip"></span>
    </header>
    <div class="editor-wrap">
      <textarea id="code" spellcheck="false" placeholder="# Paste build123d code here. Assign your part to `result`.
from build123d import *

with BuildPart() as p:
    Box(40, 30, 20)
    with Locations((0, 0, 10)):
        Hole(5, 20)

result = p.part
"></textarea>
      <div class="drop-overlay">Drop a .py file</div>
    </div>
    <div class="toolbar">
      <button class="primary" id="renderBtn">Render</button>
      <button class="success" id="exportBtn">Export STEP</button>
      <label class="filebtn">Open .py<input type="file" id="fileInput" accept=".py,text/x-python" /></label>
      <span class="grow"></span>
      <button id="exampleBtn" title="Load example">Example</button>
    </div>
    <div class="status" id="status">Idle.</div>
  </div>
  <div class="right">
    <canvas id="viewer"></canvas>
    <div class="hint">Left-drag rotate · right-drag pan · scroll zoom</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
