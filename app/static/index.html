<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>build123d dashboard</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #15171c;
    --panel-2: #1c1f26;
    --border: #262a33;
    --text: #e6e8ec;
    --muted: #8a91a0;
    --accent: #6ea8ff;
    --accent-2: #5fdfb1;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: minmax(380px, 38%) 1fr; height: 100vh; }
  .left { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
  .right { position: relative; min-width: 0; background: #0a0b0e; }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 13px; margin: 0; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); text-transform: uppercase; }
  header .grow { flex: 1; }
  .filechip { font-size: 12px; color: var(--muted); }
  .editor-wrap { flex: 1; position: relative; min-height: 0; display: flex; flex-direction: column; }
  textarea#code {
    flex: 1; width: 100%; resize: none; border: 0; outline: none;
    background: var(--panel); color: var(--text);
    font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 14px 16px; tab-size: 4;
  }
  .drop-overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(110, 168, 255, 0.08); border: 2px dashed var(--accent);
    color: var(--accent); font-weight: 600; pointer-events: none;
  }
  .left.dragging .drop-overlay { display: flex; }
  .toolbar {
    display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border);
    background: var(--panel-2); align-items: center;
  }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 6px; font-size: 13px; cursor: pointer;
    transition: background 120ms, border-color 120ms;
  }
  button:hover { background: #20242d; border-color: #323743; }
  button.primary { background: var(--accent); color: #0a0b0e; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #8bbcff; }
  button.success { background: var(--accent-2); color: #0a0b0e; border-color: var(--accent-2); font-weight: 600; }
  button.success:hover { background: #7eecc4; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .toolbar .grow { flex: 1; }
  .status {
    font-size: 12px; color: var(--muted); padding: 8px 12px;
    border-top: 1px solid var(--border); min-height: 32px; white-space: pre-wrap;
    max-height: 200px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .status.error { color: var(--danger); }
  .status.ok { color: var(--accent-2); }
  #viewer { width: 100%; height: 100%; display: block; }
  .hint {
    position: absolute; bottom: 12px; left: 12px; color: var(--muted); font-size: 11px;
    background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 4px;
    pointer-events: none;
  }
  input[type="file"] { display: none; }
  label.filebtn {
    display: inline-block; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 6px; font-size: 13px;
  }
  label.filebtn:hover { background: #20242d; }

  /* Truss panel */
  .truss-panel {
    position: absolute; top: 12px; right: 12px; width: 300px;
    background: rgba(21, 23, 28, 0.96); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; color: var(--text);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    display: none; backdrop-filter: blur(6px);
    font-size: 13px;
  }
  .truss-panel.open { display: block; }
  .truss-panel h3 { margin: 0 0 10px 0; font-size: 13px; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
  .truss-panel .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .truss-panel .row label { flex: 1; color: var(--muted); font-size: 12px; }
  .truss-panel .row input[type="number"] {
    width: 70px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 4px 8px; border-radius: 4px;
    font: 12px ui-monospace, Menlo, monospace; text-align: right;
  }
  .truss-panel .row input[type="number"]:focus { outline: 1px solid var(--accent); }
  .truss-panel .stats {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin: 10px 0; font: 11.5px ui-monospace, Menlo, monospace;
    line-height: 1.7; color: var(--text); min-height: 60px;
  }
  .truss-panel .stats .savings { color: var(--accent-2); font-weight: 600; }
  .truss-panel .stats .muted { color: var(--muted); }
  .truss-panel .actions { display: flex; gap: 6px; margin-top: 10px; }
  .truss-panel .actions button { flex: 1; padding: 6px 8px; font-size: 12px; }
  .truss-panel .close-x {
    position: absolute; top: 10px; right: 12px; background: none; border: 0;
    color: var(--muted); font-size: 18px; cursor: pointer; padding: 0; line-height: 1;
  }
  .truss-panel .close-x:hover { color: var(--text); }
</style>
</head>
<body>
<div class="app">
  <div class="left" id="leftPane">
    <header>
      <h1>build123d</h1>
      <span class="grow"></span>
      <span class="filechip" id="filechip"></span>
    </header>
    <div class="editor-wrap">
      <textarea id="code" spellcheck="false" placeholder="# Paste build123d code here. Assign your part to `result`.
from build123d import *

with BuildPart() as p:
    Box(40, 30, 20)
    with Locations((0, 0, 10)):
        Hole(5, 20)

result = p.part
"></textarea>
      <div class="drop-overlay">Drop a .py file</div>
    </div>
    <div class="toolbar">
      <button class="primary" id="renderBtn">Render</button>
      <button class="success" id="exportBtn">Export STEP</button>
      <button id="trussifyBtn" title="Cut a hex truss pattern">Trussify</button>
      <label class="filebtn">Open .py<input type="file" id="fileInput" accept=".py,text/x-python" /></label>
      <span class="grow"></span>
      <button id="exampleBtn" title="Load example">Example</button>
    </div>
    <div class="status" id="status">Idle.</div>
  </div>
  <div class="right">
    <canvas id="viewer"></canvas>
    <div class="hint">Left-drag rotate · right-drag pan · scroll zoom</div>

    <aside class="truss-panel" id="trussPanel">
      <button class="close-x" id="trussCloseX" title="Close">×</button>
      <h3>Trussify — hex honeycomb</h3>

      <div class="row">
        <label>Cell size (mm)</label>
        <input type="number" id="cellSize" value="12" min="3" max="100" step="0.5">
      </div>
      <div class="row">
        <label>Wall thickness (mm)</label>
        <input type="number" id="wallThick" value="2" min="0.5" max="20" step="0.1">
      </div>
      <div class="row">
        <label>Safety margin (mm)</label>
        <input type="number" id="safetyMargin" value="2" min="0" max="20" step="0.1">
      </div>
      <div class="row">
        <label>Density (g/cm³)</label>
        <input type="number" id="density" value="1.25" min="0.1" max="20" step="0.01">
      </div>

      <div class="stats" id="trussStats">
        <span class="muted">Click Preview to analyze and trussify.</span>
      </div>

      <div class="actions">
        <button id="trussPreviewBtn" class="primary">Preview</button>
        <button id="trussApplyBtn" class="success">Apply to script</button>
      </div>
    </aside>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="/app.js"></script>
</body>
</html>
